overview: "Raise Hue lights while Jellyfin is paused, then resume Hue Sync."
description: >
  When playback pauses and a Hue Sync device is in sync mode, switch that device
  to passthrough and raise its entertainment lights to a chosen brightness.
  Play and stop put the device back into the sync mode it was using.
